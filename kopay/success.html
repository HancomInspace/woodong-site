<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 완료 — 우동짐</title>
<style>
  :root{ --teal:#0F6E56; --text:#1A1A18; --gray:#6B6A65; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#fff; color:var(--text); text-align:center; padding:24px;
        font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  .mark{ width:72px; height:72px; border-radius:50%; background:var(--teal); margin:0 auto 20px;
         display:flex; align-items:center; justify-content:center; }
  h1{ font-size:22px; margin:0 0 10px; }
  p{ color:var(--gray); font-size:15px; line-height:1.7; margin:0; }
  a{ color:var(--teal); }
</style>
</head>
<body>
  <div>
    <div class="mark">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"
           stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
    </div>
    <h1>결제가 완료되었습니다</h1>
    <p>이용권이 발급되었습니다.<br>
       우동짐 앱으로 돌아가 <strong>이용권</strong> 탭에서 확인하세요.</p>
    <p style="margin-top:18px; font-size:13px;">
      문의: <a href="mailto:prime@inspace.re.kr">prime@inspace.re.kr</a>
    </p>
  </div>
</body>
</html>
